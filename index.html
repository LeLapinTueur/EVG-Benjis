<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EVG Belgique - Comparateur</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,sans-serif;
    background:#f4f6f8;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    border:none;
    padding:15px;
    cursor:pointer;
    font-size:18px;
    border-radius:8px;
    background:#ddd;
}

.tab.active{
    background:#0078d4;
    color:white;
}

.city{
    display:none;
}

.city.active{
    display:block;
}

.actions{
    margin-bottom:20px;
}

button{
    cursor:pointer;
}

.add-btn{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
}

.activity{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.activity h3{
    margin-bottom:5px;
}

.price{
    font-weight:bold;
    color:#0078d4;
}

.link{
    margin-top:10px;
}

.link a{
    color:#0078d4;
    text-decoration:none;
}

.controls{
    display:flex;
    gap:10px;
}

.edit{
    background:#ffc107;
    border:none;
    padding:8px 12px;
    border-radius:5px;
}

.delete{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
}

.summary{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    width:90%;
    max-width:500px;
    padding:20px;
    border-radius:10px;
}

.modal-content input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

.save-btn{
    width:100%;
    background:#0078d4;
    color:white;
    border:none;
    padding:12px;
    border-radius:6px;
}

@media(max-width:768px){
    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }
}
</style>

</head>
<body>

<div class="container">

<h1>🍻 EVG Belgique</h1>

<div class="tabs">
    <button class="tab active" onclick="changeCity('bruxelles',this)">Bruxelles</button>
    <button class="tab" onclick="changeCity('charleroi',this)">Charleroi</button>
</div>

<div id="bruxelles" class="city active">
    <div class="actions">
        <button class="add-btn" onclick="openModal('bruxelles')">
            ➕ Ajouter une activité
        </button>
    </div>

    <div class="activities"></div>
    <div class="summary"></div>
</div>

<div id="charleroi" class="city">
    <div class="actions">
        <button class="add-btn" onclick="openModal('charleroi')">
            ➕ Ajouter une activité
        </button>
    </div>

    <div class="activities"></div>
    <div class="summary"></div>
</div>

</div>

<div class="modal" id="modal">
    <div class="modal-content">

        <h2 id="modalTitle">Activité</h2>

        <input id="name" placeholder="Nom">

        <input id="price" type="number" placeholder="Prix">

        <input id="location" placeholder="Lieu">

        <input id="link" placeholder="Lien">

        <button class="save-btn" onclick="saveActivity()">
            Sauvegarder
        </button>

    </div>
</div>

<script>

const defaultData = {

    bruxelles: [

    ],

    charleroi: [
        {
            name:"Laser Game Evolution",
            price:28,
            location:"Gosselies",
            link:"https://gosselies.lasergame-evolution.be/tarifs/"
        },

        {
            name:"EVA Charleroi",
            price:45,
            location:"Charleroi",
            link:"https://www.eva.gg/fr-BE/locations/charleroi-6000"
        },

        {
            name:"Airspace Indoor Skydiving",
            price:60,
            location:"Belgique",
            link:"https://shop.airspace.be/adultes"
        },

        {
            name:"Lancer de Hache Basse-Sambre",
            price:49,
            location:"Tamines",
            link:"https://www.lancerdehachebassesambre.be/"
        }
    ]
};

let data =
JSON.parse(localStorage.getItem("evgData"))
||
defaultData;

let currentCity = "";
let editIndex = null;

function saveStorage(){
    localStorage.setItem(
        "evgData",
        JSON.stringify(data)
    );
}

function render(){

    Object.keys(data).forEach(city=>{

        const container =
        document.querySelector(
            "#" + city + " .activities"
        );

        container.innerHTML="";

        let total=0;

        data[city].forEach((activity,index)=>{

            total += Number(activity.price);

            container.innerHTML += `
            <div class="activity">

                <div class="header">

                    <div>
                        <h3>${activity.name}</h3>

                        <div>${activity.location}</div>

                        <div class="price">
                            ${activity.price} €
                        </div>

                        <div class="link">
                            <a href="${activity.link}" target="_blank">
                                Accéder au site
                            </a>
                        </div>

                    </div>

                    <div class="controls">
                        <button class="edit"
                        onclick="${city}Edit(${index})">
                        ✏️
                        </button>

                        <button class="delete"
                        onclick="${city}Delete(${index})">
                        🗑️
                        </button>
                    </div>

                </div>

            </div>
            `;
        });

        document.querySelector(
            "#" + city + " .summary"
        ).innerHTML =
        "💰 Budget total : " +
        total +
        " € / personne";

    });

}

function bruxellesEdit(index){
    editActivity("bruxelles",index);
}

function charleroiEdit(index){
    editActivity("charleroi",index);
}

function bruxellesDelete(index){
    deleteActivity("bruxelles",index);
}

function charleroiDelete(index){
    deleteActivity("charleroi",index);
}

function editActivity(city,index){

    currentCity=city;
    editIndex=index;

    let item=data[city][index];

    name.value=item.name;
    price.value=item.price;
    location.value=item.location;
    link.value=item.link;

    modal.style.display="flex";
}

function deleteActivity(city,index){

    if(confirm("Supprimer cette activité ?")){

        data[city].splice(index,1);

        saveStorage();
        render();
    }
}

function openModal(city){

    currentCity=city;
    editIndex=null;

    name.value="";
    price.value="";
    location.value="";
    link.value="";

    modal.style.display="flex";
}

function saveActivity(){

    const activity = {

        name:name.value,
        price:Number(price.value),
        location:location.value,
        link:link.value

    };

    if(editIndex !== null){

        data[currentCity][editIndex]
        =
        activity;

    }else{

        data[currentCity]
        .push(activity);
    }

    saveStorage();

    render();

    modal.style.display="none";
}

function changeCity(city,button){

    document
    .querySelectorAll('.city')
    .forEach(el=>el.classList.remove('active'));

    document
    .querySelectorAll('.tab')
    .forEach(el=>el.classList.remove('active'));

    document
    .getElementById(city)
    .classList.add('active');

    button.classList.add('active');
}

modal.addEventListener("click",(e)=>{

    if(e.target.id==="modal"){
        modal.style.display="none";
    }
});

render();

</script>

</body>
</html>
