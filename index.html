<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101a2d">
  <title>Accueil</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <style>
    :root { --ink:#172238; --muted:#667085; --navy:#101a2d; --yellow:#ffc928; --paper:#f5f6f8; --line:#e5e8ee; --green:#16794b; --green-bg:#e8f5ee; --red:#b42318; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
      font:15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; display:flex; flex-direction:column; }
    header { background:linear-gradient(120deg,#101a2d,#253b5c); color:#fff; padding:56px 22px 70px; }
    .wrap { max-width:920px; margin:auto; padding:0 18px; }
    .eyebrow { text-transform:uppercase; letter-spacing:.16em; font-size:12px; font-weight:800; color:var(--yellow); }
    h1 { font-size:clamp(34px,6vw,56px); line-height:1.05; margin:10px 0 8px; }
    header p { margin:0; color:#d8dfeb; max-width:520px; }
    main { max-width:920px; width:100%; margin:-34px auto 0; padding:0 18px 40px; flex:1; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
    .card { all:unset; box-sizing:border-box; cursor:pointer; background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px;
      box-shadow:0 2px 8px rgba(16,26,45,.05); display:flex; flex-direction:column; gap:10px; min-height:176px;
      transition:transform .15s, box-shadow .15s, border-color .15s; }
    .card:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(16,26,45,.12); border-color:#cbd5e1; }
    .card:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
    .cardwrap { position:relative; display:flex; }
    .cardwrap .card { flex:1; }
    .gear { all:unset; position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
      cursor:pointer; font-size:17px; color:var(--muted); }
    .gear:hover { background:#f2f4f7; color:var(--ink); }
    .gear:focus-visible { outline:3px solid var(--yellow); }
    .chip.pub { background:#e7f0fb; color:#245a9a; }
    .link { all:unset; cursor:pointer; color:#245a9a; font-weight:700; font-size:13px; text-decoration:underline; margin-right:auto; align-self:center; }
    .ico { width:52px; height:52px; border-radius:14px; background:#fff4c9; display:grid; place-items:center; font-size:28px; }
    .card h2 { margin:2px 0 0; font-size:20px; }
    .card p { margin:0; color:var(--muted); font-size:14px; flex:1; }
    .chip { align-self:flex-start; font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; background:#f2f4f7; color:var(--muted); }
    .chip.on { background:var(--green-bg); color:var(--green); }
    .chip.setup { background:#fff4c9; color:#7a5b00; }
    .state { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; color:var(--muted); }
    .state.err { color:var(--red); border-color:#fecdca; background:#fef3f2; }
    .skeleton { height:176px; border-radius:18px; background:linear-gradient(90deg,#eceff3,#f7f8fa,#eceff3); background-size:200% 100%; animation:sh 1.2s infinite; }
    @keyframes sh { to { background-position:-200% 0; } }
    footer { text-align:center; padding:0 18px 28px; }
    footer button { all:unset; cursor:pointer; color:var(--muted); font-size:13px; font-weight:700; text-decoration:underline; }
    .ovl { position:fixed; inset:0; background:rgba(16,26,45,.55); display:grid; place-items:center; padding:18px; z-index:50; }
    .ovl.hidden { display:none; }
    .box { background:#fff; border-radius:18px; padding:24px; max-width:420px; width:100%; }
    .box h3 { margin:0 0 4px; font-size:20px; }
    .box p.d { margin:0 0 4px; color:var(--muted); font-size:14px; }
    .box label { display:block; font-weight:700; font-size:13px; margin-top:12px; }
    .box input { display:block; width:100%; margin-top:4px; padding:11px 12px; border:1px solid #d0d5dd; border-radius:10px; font:inherit; }
    .box input:focus { outline:2px solid var(--yellow); border-color:var(--yellow); }
    .msg { min-height:20px; font-size:13px; font-weight:700; margin-top:10px; color:var(--red); }
    .msg.info { color:#7a5b00; }
    .row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
    .btn { font:inherit; font-weight:700; border:1px solid #d0d5dd; background:#fff; color:var(--ink); border-radius:10px; padding:9px 16px; cursor:pointer; }
    .btn.pri { background:var(--navy); border-color:var(--navy); color:#fff; }
    .btn:disabled { opacity:.6; cursor:default; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Espace privé</div>
      <h1>Mes sites</h1>
      <p>Choisissez un espace. Chacun est protégé par son propre mot de passe.</p>
    </div>
  </header>

  <main>
    <div class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>
  <footer><button id="logoutAll" hidden>Se déconnecter de tous les sites</button></footer>

  <div class="ovl hidden" id="ovl">
    <form class="box" id="form" autocomplete="off">
      <h3 id="mTitle"></h3>
      <p class="d" id="mDesc"></p>
      <label>Mot de passe <input type="password" id="pw" autocomplete="current-password"></label>
      <label id="pw2Wrap">Confirmer le mot de passe <input type="password" id="pw2" autocomplete="new-password"></label>
      <div class="msg" id="msg"></div>
      <div class="row">
        <button type="button" class="link" id="guestBtn" hidden>👀 Consulter sans mot de passe</button>
        <button type="button" class="btn" id="cancel">Annuler</button>
        <button type="submit" class="btn pri" id="submit">Entrer</button>
      </div>
    </form>
  </div>

  <script src="/shared/config.js"></script>
  <script src="/shared/hub.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = Hub.esc;
    let sites = [];
    let current = null;

    function render() {
      const grid = $('grid');
      if (!sites.length) { grid.innerHTML = '<div class="state">Aucun site n\'est encore déclaré dans la base (table « sites »).</div>'; return; }
      grid.innerHTML = '';
      sites.forEach((s) => {
        const ses = Hub.getSession(s.slug);
        const chip = !s.configured ? '<span class="chip setup">⚙️ À configurer</span>'
          : ses ? '<span class="chip on">🔓 Connecté · ' + (ses.role === 'admin' ? 'admin' : 'lecteur') + '</span>'
          : s.public_read ? '<span class="chip pub">👀 Consultation libre</span>'
          : '<span class="chip">🔒 Mot de passe</span>';
        const w = document.createElement('div');
        w.className = 'cardwrap';
        w.innerHTML = '<button class="card"><div class="ico">' + esc(s.emoji) + '</div><h2>' + esc(s.title) + '</h2><p>' + esc(s.description) + '</p>' + chip + '</button>' +
          '<button class="gear" title="Réglages (administrateur)" aria-label="Réglages de ' + esc(s.title) + '">⚙️</button>';
        w.querySelector('.card').onclick = () => openSite(s);
        w.querySelector('.gear').onclick = () => (s.configured ? Hub.manage(s, (changed) => { if (changed) reload(); }) : openSite(s));
        grid.appendChild(w);
      });
      $('logoutAll').hidden = !Hub.allSessions().length;
    }

    function openSite(s, why, force) {
      if (!force && s.configured && (Hub.getSession(s.slug) || s.public_read)) { location.href = s.path; return; }
      current = s;
      const first = !s.configured;
      $('mTitle').textContent = (first ? '⚙️ ' : '🔒 ') + s.title;
      $('mDesc').textContent = first
        ? 'Première utilisation : choisissez le mot de passe administrateur (8 caractères minimum). Vous pourrez ensuite créer un mot de passe « lecteur » depuis le site.'
        : 'Saisissez le mot de passe de cet espace.';
      $('pw2Wrap').style.display = first ? '' : 'none';
      $('pw').autocomplete = first ? 'new-password' : 'current-password';
      $('submit').textContent = first ? 'Créer et entrer' : 'Entrer';
      $('form').reset();
      $('guestBtn').hidden = !(s.configured && s.public_read);
      const m = $('msg');
      m.className = 'msg' + (why === 'expired' ? ' info' : '');
      m.textContent = why === 'expired' ? 'Votre session a expiré, reconnectez-vous.' : '';
      $('ovl').classList.remove('hidden');
      $('pw').focus();
    }
    const closeModal = () => $('ovl').classList.add('hidden');
    $('guestBtn').onclick = () => { location.href = current.path; };
    $('cancel').onclick = closeModal;
    $('ovl').addEventListener('click', (e) => { if (e.target === $('ovl')) closeModal(); });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const s = current, pw = $('pw').value, m = $('msg');
      const fail = (t) => { m.className = 'msg'; m.textContent = t; };
      if (!pw) return fail('Saisissez le mot de passe.');
      if (!s.configured) {
        if (pw.length < 8) return fail('8 caractères minimum.');
        if (pw !== $('pw2').value) return fail('Les deux saisies sont différentes.');
      }
      const btn = $('submit'); btn.disabled = true; m.textContent = '';
      try {
        const r = s.configured ? await Hub.login(s.slug, pw) : await Hub.claim(s.slug, pw);
        if (!r) return fail('Mot de passe incorrect (après 5 erreurs, patientez 10 minutes).');
        location.href = s.path;
      } catch (err) {
        fail(err.status === 401 || err.status === 403 ? 'Clé Supabase refusée : vérifiez shared/config.js.' : err.message);
      } finally { btn.disabled = false; }
    });

    $('logoutAll').onclick = async () => {
      await Promise.all(Hub.allSessions().map((slug) => Hub.logout(slug)));
      render();
    };

    async function reload() {
      try { sites = await Hub.rpc('list_sites'); } catch (e) { return; }
      render();
    }

    (async function init() {
      if (!Hub.configured()) {
        $('grid').innerHTML = '<div class="state err">Supabase n\'est pas encore configuré. Renseignez l\'URL et la clé publique dans <b>shared/config.js</b>, puis redéployez.</div>';
        return;
      }
      try { sites = await Hub.rpc('list_sites'); }
      catch (e) {
        $('grid').innerHTML = '<div class="state err">Impossible de charger les sites (' + esc(e.message) + ').' +
          (e.status === 401 || e.status === 403 ? ' Vérifiez la clé dans shared/config.js.' : ' Avez-vous exécuté supabase-setup.sql ?') + '</div>';
        return;
      }
      render();
      const p = new URLSearchParams(location.search), open = p.get('open');
      if (open) {
        const s = sites.find((x) => x.slug === open);
        if (s) openSite(s, p.get('why'), true);
        history.replaceState(null, '', location.pathname);
      }
    })();
  </script>
</body>
</html>
