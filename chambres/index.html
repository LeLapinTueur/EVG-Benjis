<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chambres</title>
<style>
  :root { --ink:#1f2a3c; --mut:#6b7587; --acc:#3d6fb6; --acc2:#2c5391; --bg:#f3f5f9; --card:#fff; --line:#dde3ee; --ok:#2e7d32; --bad:#b3261e; --wood:#9b7653; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  body.booting main { visibility:hidden; }
  main { max-width:1320px; margin:0 auto; padding:14px; }
  .head { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .head h1 { font-size:22px; margin:0; flex:1; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; color:var(--mut); }
  .stat b { color:var(--ink); font-size:16px; }
  .layout { display:grid; grid-template-columns:290px 1fr; gap:14px; align-items:start; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .side { position:sticky; top:56px; max-height:calc(100vh - 70px); display:flex; flex-direction:column; }
  @media (max-width:820px) { .side { position:static; max-height:none; } }
  .side h2 { font-size:15px; margin:0 0 8px; }
  input[type=text], input[type=number], input[type=search], select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; width:100%; }
  .btn { background:var(--acc); color:#fff; border:0; border-radius:9px; padding:8px 14px; font:600 14px inherit; font-family:inherit; cursor:pointer; }
  .btn:hover { background:var(--acc2); } .btn.ghost { background:#fff; color:var(--acc2); border:1px solid var(--line); } .btn.danger { background:#fff; color:var(--bad); border:1px solid #efc4c0; }
  .btn.sm { padding:4px 9px; font-size:13px; }
  .tools { display:grid; gap:6px; margin-bottom:8px; }
  .glist { overflow:auto; flex:1; min-height:80px; display:grid; gap:5px; align-content:start; padding:2px; border-radius:10px; }
  .glist.over { outline:2px dashed var(--acc); background:#eef3fb; }
  .g { display:flex; align-items:center; gap:6px; background:#f7f9fd; border:1px solid var(--line); border-radius:8px; padding:5px 8px; cursor:grab; user-select:none; }
  .g .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g.dragging { opacity:.4; } .g.ro { cursor:default; }
  .g select { width:auto; max-width:115px; padding:3px 4px; font-size:12px; }
  .empty { color:var(--mut); text-align:center; padding:14px 6px; font-size:14px; }
  .rooms { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; align-items:start; }
  .room { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .room.over { border-color:var(--acc); background:#f4f8fd; } .room.full { border-color:#b9d8bb; }
  .rh { display:flex; align-items:flex-start; gap:6px; } .rh .t { flex:1; font-weight:700; font-size:16px; overflow-wrap:anywhere; }
  .meta { font-size:13px; color:var(--mut); display:flex; gap:10px; flex-wrap:wrap; }
  .cap { font-weight:700; } .cap.full { color:var(--ok); }
  .floor { background:#efe6da; border-radius:12px; padding:14px 10px; display:flex; flex-wrap:wrap; gap:18px 16px; justify-content:center; align-items:flex-start;
           background-image:repeating-linear-gradient(90deg,rgba(120,90,60,.07) 0 2px,transparent 2px 34px),repeating-linear-gradient(0deg,rgba(120,90,60,.04) 0 1px,transparent 1px 60px); box-shadow:inset 0 0 0 1px rgba(120,90,60,.15); }
  .bedwrap { display:grid; gap:4px; justify-items:center; } .bedlabel { font-size:11px; color:#8c7a68; text-transform:uppercase; letter-spacing:.05em; }
  .bed { position:relative; filter:drop-shadow(0 5px 6px rgba(70,45,20,.28)); }
  .bed svg { display:block; width:100%; height:auto; }
  .bed.single, .bed.air { width:122px; } .bed.double { width:204px; } .bed.bunk { width:150px; }
  .slot { position:absolute; border-radius:10px; }
  .slot:not(.taken) { border:2px dashed rgba(90,70,50,.35); background:rgba(255,255,255,.28); }
  .slot:not(.taken)::after { content:"libre"; position:absolute; left:50%; top:62%; transform:translate(-50%,-50%); font-size:12px; color:rgba(70,55,40,.65); text-shadow:0 0 4px #fff; }
  .bed.bunk .slot:not(.taken)::after { left:70%; top:50%; }
  .slot.over { border-color:var(--acc); background:rgba(61,111,182,.28); border-style:solid; }
  .p { position:absolute; inset:0; cursor:grab; user-select:none; } .p.ro { cursor:default; } .p.dragging { opacity:.4; }
  .av { position:absolute; top:7px; left:50%; transform:translateX(-50%); width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font:700 12px system-ui; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35); }
  .tag { position:absolute; top:60%; left:50%; transform:translate(-50%,-50%); max-width:94%; background:rgba(255,255,255,.94); border-radius:99px; padding:2px 8px; font-size:12px; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.25); display:flex; gap:4px; align-items:center; white-space:nowrap; }
  .tag .nm { overflow:hidden; text-overflow:ellipsis; max-width:84px; } .tag button { border:0; background:none; color:var(--mut); cursor:pointer; font-size:13px; padding:0; line-height:1; }
  .bed.bunk .av { top:50%; left:6px; transform:translateY(-50%); width:26px; height:26px; font-size:11px; }
  .bed.bunk .tag { top:50%; left:72%; max-width:56%; padding:2px 6px; font-size:11px; }
  .bed.bunk .tag .nm { max-width:40px; }
  .nobeds { color:var(--mut); font-size:13px; text-align:center; padding:12px; }
  .ovl { position:fixed; inset:0; background:rgba(20,30,50,.5); display:grid; place-items:center; padding:16px; z-index:120; }
  .dlg { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:400px; display:grid; gap:10px; }
  .dlg label { display:grid; gap:3px; font-size:13px; color:var(--mut); } .dlg .act { display:flex; gap:8px; justify-content:flex-end; }
  .bt { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:6px 10px; }
  .bt small { color:var(--mut); } .step { display:flex; align-items:center; gap:8px; } .step button { width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:18px; cursor:pointer; } .step b { min-width:20px; text-align:center; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#1f2a3c; color:#fff; padding:10px 16px; border-radius:10px; z-index:150; display:none; max-width:90vw; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; color:var(--mut); }
  .seg button.on { background:var(--acc); color:#fff; }
  #recap table { border-collapse:collapse; width:100%; font-size:14px; } #recap th, #recap td { text-align:left; padding:6px 10px; border-bottom:1px solid #eef1f6; }
  #recap th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); } #recap td.n, #recap th.n { text-align:right; }
  #recap .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; } #recap h3 { margin:0 0 6px; font-size:14px; }
  #recap .big { font-size:15px; margin-bottom:10px; } #recap .big b { font-size:20px; } #recap .warn { color:var(--bad); font-weight:600; } #recap .okk { color:var(--ok); font-weight:600; }
  #recap ul { margin:0; padding:0; list-style:none; display:grid; gap:4px; } #recap li { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid #eef1f6; padding:3px 0; } #recap li span:last-child { color:var(--mut); text-align:right; }
  .occ { display:grid; gap:5px; align-content:start; }
  .g button.x { border:0; background:none; color:var(--mut); cursor:pointer; font-size:14px; padding:0 2px; }
  .freeslot { border:1px dashed var(--line); border-radius:8px; padding:5px 8px; color:#a9b1bf; font-size:13px; text-align:center; }
  body.ro .adm { display:none !important; }
</style>
</head>
<body class="booting">
<main>
  <div class="head">
    <h1>🛏️ Chambres</h1>
    <div class="stats" id="stats"></div>
    <span class="seg" id="modeBar" title="Affichage des chambres"><button type="button" data-m="detail">🛏️ Avec lits</button><button type="button" data-m="simple">📋 Simple</button></span>
    <span class="seg" id="roomFilter"><button type="button" data-f="all" class="on">Toutes les chambres</button><button type="button" data-f="free" id="freeBtn">Places libres</button></span>
    <button class="btn ghost" id="recapBtn" type="button">📊 Récapitulatif</button>
    <button class="btn adm" id="addRoom" type="button">＋ Ajouter une chambre</button>
  </div>
  <section class="panel" id="recap" hidden style="margin-bottom:14px"></section>
  <div class="layout">
    <aside class="panel side">
      <h2>Invités <span id="gcount" style="color:var(--mut);font-weight:400"></span></h2>
      <div class="tools">
        <input type="search" id="q" placeholder="Rechercher un invité…">
        <select id="filter"><option value="free">Sans chambre</option><option value="all">Tous</option><option value="placed">Avec chambre</option></select>
        <div class="note" style="font-size:13px;color:var(--mut)">Les invités se gèrent dans le site <a href="/invites/">Invités</a>.</div>
      </div>
      <div class="glist" id="glist"></div>
    </aside>
    <section>
      <div class="rooms" id="rooms"></div>
      <div class="empty" id="noFree" hidden>Toutes les chambres sont complètes 🎉</div>
      <div class="empty" id="noRooms" hidden>Aucune chambre pour l'instant.<span class="adm"> Cliquez sur « Ajouter une chambre ».</span></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="/shared/config.js"></script>
<script src="/shared/hub.js"></script>
<script>
(async function () {
  const SLUG = 'chambres';
  const hub = await Hub.connect(SLUG);
  hub.mountBar();
  const ADMIN = hub.isAdmin;
  document.body.classList.toggle('ro', !ADMIN);
  document.body.classList.remove('booting');
  const $ = (id) => document.getElementById(id);
  const esc = Hub.esc;
  const ses = Hub.getSession(SLUG), token = ses ? ses.token : null;
  const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); };
  const uid = () => Math.random().toString(36).slice(2, 8);

  // Types de couchage : nombre de places, libellé
  const TYPES = {
    single: { places: 1, label: 'Lit simple', plural: 'simples', one: 'simple', hint: '1 place' },
    double: { places: 2, label: 'Lit double', plural: 'doubles', one: 'double', hint: '2 places' },
    bunk:   { places: 2, label: 'Lits superposés', plural: 'superposés', one: 'superposé', hint: '2 places (haut + bas)' },
    air:    { places: 1, label: 'Matelas gonflable', plural: 'gonflables', one: 'gonflable', hint: '1 place en plus' }
  };
  const TYPE_ORDER = ['double', 'single', 'bunk', 'air'];

  // data = { rooms:[{id,name,beds:[{id,type}]}], assign:{invitéId: chambreId}, seat:{invitéId: "litId:n"} }
  let data = { rooms: [], assign: {}, seat: {} };
  let guests = [];
  // ----- modèle -----
  // data = { mode:'detail'|'simple', rooms:[{id,name, beds:[{id,type}] (mode lits) | cap (mode simple)}], assign:{invité: chambre}, seat:{invité: "lit:n"} }
  const bedsCap = (r) => (r.beds || []).reduce((a, b) => a + TYPES[b.type].places, 0);
  const seatKeys = (r) => (r.beds || []).flatMap(b => Array.from({ length: TYPES[b.type].places }, (_, i) => b.id + ':' + i));
  function validSeat(D, gid) {           // la place du lit existe-t-elle, dans la chambre où l'invité est affecté ?
    const r = D.rooms.find(x => x.id === D.assign[gid]); const k = D.seat[gid];
    return !!(r && k && seatKeys(r).includes(k));
  }
  function reconcileBeds(D, r) {          // passe une chambre en « mode lits » : crée / ajuste les lits d'après son nombre de places
    let changed = false;
    const used = new Set(Object.values(D.seat));
    const occN = Object.values(D.assign).filter(x => x === r.id).length;
    if (!Array.isArray(r.beds)) {
      changed = true; const beds = [];
      if (r.single || r.double) {         // ancien format : lits simples / doubles
        for (let i = 0; i < (+r.double || 0); i++) beds.push({ id: uid(), type: 'double' });
        for (let i = 0; i < (+r.single || 0); i++) beds.push({ id: uid(), type: 'single' });
      } else { const c = Math.max(1, +r.cap || 1); for (let i = 0; i < Math.floor(c / 2); i++) beds.push({ id: uid(), type: 'double' }); if (c % 2) beds.push({ id: uid(), type: 'single' }); }
      r.beds = beds;
    }
    if (r.cap != null) {
      let have = bedsCap(r); const want = Math.max(1, +r.cap || 1);
      while (have < want) { r.beds.push({ id: uid(), type: 'single' }); have++; changed = true; }
      for (let i = r.beds.length - 1; i >= 0 && have > Math.max(want, occN); i--) {   // trop de lits : on retire des lits vides seulement
        const b = r.beds[i], n = TYPES[b.type].places;
        const empty = Array.from({ length: n }, (_, j) => !used.has(b.id + ':' + j)).every(Boolean);
        if (empty && have - n >= Math.max(want, occN)) { r.beds.splice(i, 1); have -= n; changed = true; }
      }
    }
    delete r.cap; delete r.single; delete r.double;
    return changed;
  }
  function ensureSeats(D) {               // chaque invité affecté à une chambre doit avoir une place dans un lit
    let changed = false;
    Object.keys(D.assign).forEach(gid => { if (!D.rooms.some(r => r.id === D.assign[gid])) { delete D.assign[gid]; delete D.seat[gid]; changed = true; } });
    Object.keys(D.seat).forEach(gid => { if (!validSeat(D, gid)) { delete D.seat[gid]; changed = true; } });
    const taken = new Set(Object.values(D.seat));
    Object.keys(D.assign).forEach(gid => {
      if (D.seat[gid]) return;
      const r = D.rooms.find(x => x.id === D.assign[gid]);
      const k = seatKeys(r).find(x => !taken.has(x));
      if (k) { D.seat[gid] = k; taken.add(k); } else delete D.assign[gid];
      changed = true;
    });
    return changed;
  }
  function migrate(d) {
    const D = { mode: d && d.mode === 'simple' ? 'simple' : 'detail', rooms: Array.isArray(d && d.rooms) ? d.rooms : [],
                assign: (d && d.assign && typeof d.assign === 'object') ? d.assign : {}, seat: (d && d.seat && typeof d.seat === 'object') ? d.seat : {} };
    let changed = false;
    if (D.mode === 'detail') { D.rooms.forEach(r => { if (reconcileBeds(D, r)) changed = true; }); if (ensureSeats(D)) changed = true; }
    else D.rooms.forEach(r => { if (r.cap == null) { r.cap = Math.max(1, bedsCap(r) || +r.cap || 1); changed = true; } });
    return { out: D, changed };
  }
  function load(d) { data = migrate(d).out; }
  { const m = migrate(hub.data); data = m.out; if (m.changed && ADMIN) setTimeout(() => save(), 0); }
  const SIMPLE = () => data.mode === 'simple';

  function clean() {   // ne garde que des affectations cohérentes (chambre et, en mode lits, lit existant)
    Object.keys(data.assign).forEach(g => { if (!data.rooms.some(r => r.id === data.assign[g])) { delete data.assign[g]; delete data.seat[g]; } });
    Object.keys(data.seat).forEach(g => { if (!data.assign[g] || !validSeat(data, g)) delete data.seat[g]; });
    if (!SIMPLE()) ensureSeats(data);
  }
  const save = () => { if (!ADMIN) return; clean(); hub.save(() => data); };

  const gById = (id) => guests.find(g => g.id === id);
  const capOf = (r) => SIMPLE() ? Math.max(0, +r.cap || 0) : bedsCap(r);
  const seatsOf = (r) => seatKeys(r);
  const whoAt = (k) => guests.find(g => data.seat[g.id] === k);
  const occ = (rid) => guests.filter(g => data.assign[g.id] === rid && (SIMPLE() || data.seat[g.id]));
  const isPlaced = (gid) => !!roomOf(gid) && (SIMPLE() || !!data.seat[gid]);
  const roomOf = (gid) => data.assign[gid] && data.rooms.find(r => r.id === data.assign[gid]);
  const roomOfSeat = (k) => data.rooms.find(r => (r.beds || []).some(b => b.id === k.split(':')[0]));
  const freeSeat = (r) => seatsOf(r).find(k => !whoAt(k));

  async function loadGuests() {
    try {
      const rows = await Hub.rpc('invites_list', { p_slug: SLUG, p_token: token });
      guests = (rows || []).map(r => ({ id: r.id, name: r.name }));
      render();
    } catch (e) { toast('Liste des invités indisponible : ' + e.message); }
  }

  // ---------- déplacements ----------
  function placeAt(gid, key) {            // sur une place précise (échange si l'autre est déjà posé dans un lit)
    if (!ADMIN) return;
    const r = roomOfSeat(key); if (!r) return;
    const other = whoAt(key);
    if (other && other.id === gid) return;
    if (other) {
      const from = data.seat[gid];
      if (!from) { toast('Cette place est déjà prise par ' + other.name + '.'); return; }
      data.seat[other.id] = from; data.assign[other.id] = data.assign[gid];
    }
    data.seat[gid] = key; data.assign[gid] = r.id;
    save(); render();
  }
  function placeInRoom(gid, rid) {        // « dans cette chambre » : première place libre
    if (!ADMIN) return;
    const r = data.rooms.find(x => x.id === rid); if (!r) return;
    if (SIMPLE()) {
      if (data.assign[gid] === rid) return;
      if (occ(rid).length >= capOf(r)) { toast('« ' + r.name + ' » est complète (' + capOf(r) + ' place' + (capOf(r) > 1 ? 's' : '') + ').'); return; }
      data.assign[gid] = rid; delete data.seat[gid]; save(); render(); return;
    }
    if (data.assign[gid] === rid && data.seat[gid]) return;
    const k = freeSeat(r);
    if (!k) { toast('« ' + r.name + ' » est complète (' + capOf(r) + ' place' + (capOf(r) > 1 ? 's' : '') + ').'); return; }
    placeAt(gid, k);
  }
  function unplace(gid) { if (!ADMIN) return; delete data.assign[gid]; delete data.seat[gid]; save(); render(); }

  function wireDrag(el, gid) {
    el.draggable = true;
    el.addEventListener('dragstart', (e) => { e.stopPropagation(); e.dataTransfer.setData('text/plain', gid); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  }
  function wireDrop(el, fn, stop) {
    el.addEventListener('dragover', (e) => { if (!ADMIN) return; e.preventDefault(); if (stop) e.stopPropagation(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', (e) => { e.preventDefault(); if (stop) e.stopPropagation(); el.classList.remove('over'); const gid = e.dataTransfer.getData('text/plain'); if (gid && gById(gid)) fn(gid); });
  }

  // ---------- rendu ----------
  function guestRow(g) {
    const d = document.createElement('div'); d.className = 'g' + (ADMIN ? '' : ' ro');
    const r = roomOf(g.id);
    d.innerHTML = '<span class="nm" title="' + esc(g.name) + '">' + esc(g.name) + '</span>';
    if (ADMIN) {
      wireDrag(d, g.id);
      const sel = document.createElement('select'); sel.title = 'Choisir une chambre (sans glisser)';
      sel.innerHTML = '<option value="">' + (r ? 'Retirer' : 'Chambre…') + '</option>' +
        data.rooms.map(x => { const free = capOf(x) - occ(x.id).length; return '<option value="' + x.id + '"' + (r && r.id === x.id ? ' selected' : '') + '>' + esc(x.name) + (free <= 0 && !(r && r.id === x.id) ? ' (pleine)' : '') + '</option>'; }).join('');
      if (r) sel.value = '';
      sel.onchange = () => sel.value ? placeInRoom(g.id, sel.value) : unplace(g.id);
      d.append(sel);
    } else if (r) { const s = document.createElement('span'); s.style.cssText = 'color:var(--mut);font-size:12px'; s.textContent = r.name; d.append(s); }
    return d;
  }
  // ----- illustrations (SVG dessinés ici, aucune image externe) -----
  const DUVET = ['#8fb39a', '#d99aa0', '#8eaed3', '#d8bd8a', '#b3a0cc'];
  const pillow = (x, y, w, h) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10" fill="#fff" stroke="#d6cdbf" stroke-width="1.5"/><rect x="' + (x + 6) + '" y="' + (y + 6) + '" width="' + (w - 12) + '" height="' + (h - 12) + '" rx="7" fill="none" stroke="#ebe4d8"/>';
  const duvet = (x, y, w, h, c) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="9" fill="' + c + '"/><rect x="' + x + '" y="' + y + '" width="' + w + '" height="20" rx="9" fill="#fff" opacity=".38"/>' +
      '<path d="M' + (x + 8) + ' ' + (y + 34) + 'H' + (x + w - 8) + '" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 6"/>';
  const FRAME = '#b48b5e', FRAME_D = '#8a6542';
  const ART = {
    single: { vw: 120, vh: 200, slots: [[8, 18, 104, 172]], svg: (c) =>
      '<rect x="2" y="2" width="116" height="196" rx="13" fill="' + FRAME + '" stroke="' + FRAME_D + '" stroke-width="2"/><rect x="0" y="0" width="120" height="16" rx="8" fill="' + FRAME_D + '"/>' +
      '<rect x="9" y="17" width="102" height="175" rx="8" fill="#fbf8f2" stroke="#e5dccd"/>' + pillow(24, 24, 72, 36) + duvet(9, 72, 102, 120, c) },
    double: { vw: 200, vh: 200, slots: [[8, 18, 90, 172], [102, 18, 90, 172]], svg: (c) =>
      '<rect x="2" y="2" width="196" height="196" rx="13" fill="' + FRAME + '" stroke="' + FRAME_D + '" stroke-width="2"/><rect x="0" y="0" width="200" height="16" rx="8" fill="' + FRAME_D + '"/>' +
      '<rect x="9" y="17" width="182" height="175" rx="8" fill="#fbf8f2" stroke="#e5dccd"/>' + pillow(17, 24, 76, 36) + pillow(107, 24, 76, 36) + duvet(9, 72, 182, 120, c) +
      '<path d="M100 66V190" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>' },
    air: { vw: 120, vh: 200, slots: [[12, 20, 96, 170]], svg: () =>
      '<rect x="3" y="3" width="114" height="194" rx="38" fill="#5aa2d8" stroke="#3a80b8" stroke-width="2"/><rect x="12" y="12" width="96" height="176" rx="30" fill="#8ec6ee"/>' +
      [58, 92, 126, 160].map(y => '<rect x="12" y="' + y + '" width="96" height="6" rx="3" fill="#5aa2d8" opacity=".85"/>').join('') +
      '<rect x="30" y="22" width="60" height="26" rx="13" fill="#bfe0f6" stroke="#5aa2d8" stroke-width="2"/>' },
    bunk: { vw: 160, vh: 200, slots: [[16, 24, 110, 62], [16, 112, 110, 62]], svg: (c, c2) =>
      '<rect x="4" y="4" width="12" height="194" rx="4" fill="' + FRAME_D + '"/><rect x="126" y="4" width="12" height="194" rx="4" fill="' + FRAME_D + '"/>' +
      '<rect x="14" y="84" width="114" height="9" rx="3" fill="' + FRAME + '"/><rect x="14" y="172" width="114" height="9" rx="3" fill="' + FRAME + '"/><rect x="4" y="4" width="134" height="9" rx="4" fill="' + FRAME + '"/>' +
      '<rect x="16" y="26" width="110" height="58" rx="7" fill="#fbf8f2" stroke="#e5dccd"/><rect x="62" y="26" width="64" height="58" rx="7" fill="' + c + '"/><rect x="20" y="32" width="36" height="46" rx="10" fill="#fff" stroke="#d6cdbf"/>' +
      '<rect x="16" y="114" width="110" height="58" rx="7" fill="#fbf8f2" stroke="#e5dccd"/><rect x="62" y="114" width="64" height="58" rx="7" fill="' + c2 + '"/><rect x="20" y="120" width="36" height="46" rx="10" fill="#fff" stroke="#d6cdbf"/>' +
      '<rect x="144" y="20" width="4" height="172" rx="2" fill="' + FRAME_D + '"/><rect x="154" y="20" width="4" height="172" rx="2" fill="' + FRAME_D + '"/>' +
      [34, 58, 82, 106, 130, 154, 178].map(y => '<rect x="146" y="' + y + '" width="10" height="3" fill="' + FRAME + '"/>').join('') }
  };
  const AVC = ['#c0576b', '#4f7fb8', '#5b9a6e', '#b0813a', '#7c64b0', '#3f9aa0'];
  const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  const avColor = (n) => AVC[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];
  function bedEl(b, idx) {
    const T = TYPES[b.type], A = ART[b.type];
    const wrap = document.createElement('div'); wrap.className = 'bedwrap';
    wrap.innerHTML = '<div class="bedlabel">' + T.label + '</div>';
    const bed = document.createElement('div'); bed.className = 'bed ' + b.type;
    const c = DUVET[idx % DUVET.length], c2 = DUVET[(idx + 2) % DUVET.length];
    bed.innerHTML = '<svg viewBox="0 0 ' + A.vw + ' ' + A.vh + '" aria-hidden="true">' + A.svg(c, c2) + '</svg>';
    for (let i = 0; i < T.places; i++) {
      const k = b.id + ':' + i, g = whoAt(k), [x, y, w, h] = A.slots[i];
      const sl = document.createElement('div'); sl.className = 'slot' + (g ? ' taken' : '');
      sl.style.cssText = 'left:' + x / A.vw * 100 + '%;top:' + y / A.vh * 100 + '%;width:' + w / A.vw * 100 + '%;height:' + h / A.vh * 100 + '%';
      sl.title = b.type === 'bunk' ? (i === 0 ? 'Couchette du haut' : 'Couchette du bas') : T.label;
      if (g) {
        const p = document.createElement('div'); p.className = 'p' + (ADMIN ? '' : ' ro');
        p.innerHTML = '<span class="av" style="background:' + avColor(g.name) + '">' + esc(initials(g.name)) + '</span>' +
          '<span class="tag"><span class="nm" title="' + esc(g.name) + '">' + esc(g.name) + '</span>' + (ADMIN ? '<button type="button" title="Retirer">✕</button>' : '') + '</span>';
        if (ADMIN) { wireDrag(p, g.id); p.querySelector('button').onclick = () => unplace(g.id); }
        sl.append(p);
      }
      if (ADMIN) wireDrop(sl, (gid) => placeAt(gid, k), true);
      bed.append(sl);
    }
    wrap.append(bed); return wrap;
  }
  function render() {
    const placed = guests.filter(g => isPlaced(g.id)).length;
    const places = data.rooms.reduce((a, r) => a + capOf(r), 0);
    const nb = SIMPLE() ? 0 : data.rooms.reduce((a, r) => a + r.beds.length, 0);
    $('modeBar').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.m === data.mode); b.disabled = !ADMIN && b.dataset.m !== data.mode; });
    $('stats').innerHTML =
      '<div class="stat"><b>' + placed + '/' + guests.length + '</b> invités placés</div>' +
      '<div class="stat"><b>' + data.rooms.length + '</b> chambres · ' + (SIMPLE() ? '' : '<b>' + nb + '</b> couchages · ') + '<b>' + places + '</b> places</div>';
    const q = $('q').value.trim().toLowerCase(), f = $('filter').value;
    const list = guests.filter(g => g.name.toLowerCase().includes(q) && (f === 'all' || (f === 'free') === !isPlaced(g.id)))
                       .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    $('gcount').textContent = '(' + (guests.length - placed) + ' sans chambre)';
    const gl = $('glist'); gl.replaceChildren(...list.map(guestRow));
    if (!list.length) gl.innerHTML = '<div class="empty">' + (!guests.length ? 'Aucun invité : ajoutez-en dans le site Invités.' : f === 'free' && !q ? 'Tout le monde a une chambre 🎉' : 'Aucun résultat.') + '</div>';
    const box = $('rooms'); box.replaceChildren();
    $('noRooms').hidden = data.rooms.length > 0;
    const nFree = data.rooms.filter(r => freeIn(r) > 0).length;
    $('freeBtn').textContent = 'Places libres (' + nFree + ')';
    $('roomFilter').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.f === roomFilter));
    $('recapBtn').textContent = recapOpen ? '📊 Masquer le récapitulatif' : '📊 Récapitulatif';
    $('noFree').hidden = !(roomFilter === 'free' && data.rooms.length && !nFree);
    renderRecap();
    data.rooms.filter(r => roomFilter === 'all' || freeIn(r) > 0).forEach(r => {
      const n = occ(r.id).length, cap = capOf(r), full = cap > 0 && n >= cap;
      const el = document.createElement('div'); el.className = 'room' + (full ? ' full' : '');
      const cnt = SIMPLE() ? [] : TYPE_ORDER.map(t => [t, r.beds.filter(b => b.type === t).length]).filter(x => x[1]);
      el.innerHTML =
        '<div class="rh"><span class="t">' + esc(r.name) + '</span>' +
        (ADMIN ? '<button class="btn ghost sm" data-e title="Modifier">✏️</button><button class="btn danger sm" data-d title="Supprimer">🗑️</button>' : '') + '</div>' +
        '<div class="meta"><span class="cap ' + (full ? 'full' : '') + '">' + n + '/' + cap + ' place' + (cap > 1 ? 's' : '') + '</span>' +
        cnt.map(([t, c]) => '<span>' + c + ' ' + (c > 1 ? TYPES[t].plural : TYPES[t].one) + '</span>').join('') + '</div>';
      if (SIMPLE()) {                       // version simple : la chambre contient simplement ses occupants
        const oc = document.createElement('div'); oc.className = 'occ';
        occ(r.id).sort((a, b) => a.name.localeCompare(b.name, 'fr')).forEach(g => {
          const d = document.createElement('div'); d.className = 'g' + (ADMIN ? '' : ' ro');
          d.innerHTML = '<span class="nm" title="' + esc(g.name) + '">' + esc(g.name) + '</span>' + (ADMIN ? '<button type="button" class="x" title="Retirer">✕</button>' : '');
          if (ADMIN) { wireDrag(d, g.id); d.querySelector('.x').onclick = () => unplace(g.id); }
          oc.append(d);
        });
        for (let i = n; i < cap; i++) { const f = document.createElement('div'); f.className = 'freeslot'; f.textContent = 'place libre'; oc.append(f); }
        el.append(oc);
      } else {
        const fl = document.createElement('div'); fl.className = 'floor';
        r.beds.forEach((b, i) => fl.append(bedEl(b, i)));
        if (!r.beds.length) fl.innerHTML = '<div class="nobeds">Aucun couchage : modifiez la chambre pour en ajouter.</div>';
        el.append(fl);
      }
      if (ADMIN) {
        wireDrop(el, (gid) => placeInRoom(gid, r.id), false);
        el.querySelector('[data-e]').onclick = () => roomDialog(r);
        el.querySelector('[data-d]').onclick = () => {
          if (confirm('Supprimer « ' + r.name + ' » ?' + (n ? '\n' + n + ' invité(s) redeviendront « sans chambre ».' : ''))) {
            data.rooms = data.rooms.filter(x => x.id !== r.id); save(); render();
          }
        };
      }
      box.append(el);
    });
  }

  // ---------- places libres : filtre + récapitulatif ----------
  let roomFilter = 'all', recapOpen = false;
  const freeIn = (r) => SIMPLE() ? Math.max(0, capOf(r) - occ(r.id).length) : seatsOf(r).filter(k => !whoAt(k)).length;
  function renderRecap() {
    const box = $('recap'); box.hidden = !recapOpen; if (!recapOpen) return;
    const rows = SIMPLE() ? [] : TYPE_ORDER.map(t => {
      const beds = data.rooms.flatMap(r => r.beds.filter(b => b.type === t));
      const seatsFree = beds.map(b => Array.from({ length: TYPES[t].places }, (_, i) => !whoAt(b.id + ':' + i)).filter(Boolean).length);
      return { t, total: beds.length, whole: seatsFree.filter(n => n === TYPES[t].places).length, partial: seatsFree.filter(n => n > 0 && n < TYPES[t].places).length, places: seatsFree.reduce((a, b) => a + b, 0) };
    }).filter(x => x.total);
    const free = data.rooms.reduce((a, r) => a + freeIn(r), 0), total = data.rooms.reduce((a, r) => a + capOf(r), 0);
    const unplaced = guests.filter(g => !isPlaced(g.id)).length;
    const plural = (n, a, b) => n + ' ' + (n > 1 ? b : a);
    const verdict = unplaced > free ? '<span class="warn">⚠️ Il manque ' + plural(unplaced - free, 'place', 'places') + ' pour loger tout le monde.</span>' :
      '<span class="okk">✓ Assez de places pour les ' + unplaced + ' invité(s) sans chambre.</span>';
    box.innerHTML = '<div class="big"><b>' + free + '</b> place' + (free > 1 ? 's' : '') + ' libre' + (free > 1 ? 's' : '') + ' sur ' + total + ' · ' + plural(unplaced, 'invité sans chambre', 'invités sans chambre') + '<br>' + verdict + '</div>' +
      '<div class="grid">' + (SIMPLE() ? '' : '<div><h3>Par type de couchage</h3><table><tr><th>Type</th><th class="n">Total</th><th class="n">Entièrement libres</th><th class="n">Places libres</th></tr>' +
      rows.map(x => '<tr><td>' + TYPES[x.t].label + '</td><td class="n">' + x.total + '</td><td class="n">' + x.whole + (x.partial ? ' <small style="color:var(--mut)">(+' + x.partial + ' à moitié)</small>' : '') + '</td><td class="n"><b>' + x.places + '</b></td></tr>').join('') +
      (rows.length ? '' : '<tr><td colspan="4" class="empty">Aucun couchage.</td></tr>') + '</table></div>') +
      '<div><h3>Chambres avec de la place</h3><ul>' + (data.rooms.filter(r => freeIn(r) > 0).map(r => {
        const det = SIMPLE() ? '' : TYPE_ORDER.map(t => {
          const per = r.beds.filter(x => x.type === t).map(x => Array.from({ length: TYPES[t].places }, (_, i) => !whoAt(x.id + ':' + i)).filter(Boolean).length);
          const whole = per.filter(n => n === TYPES[t].places).length, part = per.filter(n => n > 0 && n < TYPES[t].places).length;
          if (t === 'bunk') { const n = per.reduce((a, b) => a + b, 0); return n ? n + ' couchette' + (n > 1 ? 's' : '') : ''; }
          const w = whole ? whole + ' ' + (whole > 1 ? TYPES[t].plural : TYPES[t].one) : '';
          const h = part ? part + ' ' + TYPES[t].one + (part > 1 ? 's' : '') + ' à moitié' : '';
          return [w, h].filter(Boolean).join(' + ');
        }).filter(Boolean).join(', ');
        return '<li><span>' + esc(r.name) + '</span><span><b>' + freeIn(r) + '</b> libre' + (freeIn(r) > 1 ? 's' : '') + (det ? ' <small>(' + det + ')</small>' : '') + '</span></li>';
      }).join('') || '<li><span>Toutes les chambres sont complètes 🎉</span></li>') + '</ul></div></div>';
  }
  function switchMode(m) {
    if (!ADMIN || m === data.mode) return;
    if (m === 'detail') {
      const before = Object.keys(data.assign).length;
      data.rooms.forEach(r => reconcileBeds(data, r)); data.mode = 'detail'; ensureSeats(data);
      const lost = before - Object.keys(data.assign).length;
      toast('Mode « avec lits » : les lits ont été créés d\'après le nombre de places' + (lost ? ' (' + lost + ' invité(s) sans place ont été retirés)' : '') + '. Vous pouvez les modifier avec ✏️.');
    } else {
      data.rooms.forEach(r => { r.cap = Math.max(1, bedsCap(r) || +r.cap || 1); }); data.mode = 'simple';
      toast('Mode simple : on place les invités dans les chambres, sans choisir de lit. Vos lits sont conservés.');
    }
    save(); render();
  }
  $('modeBar').querySelectorAll('button').forEach(b => b.onclick = () => switchMode(b.dataset.m));
  $('roomFilter').querySelectorAll('button').forEach(b => b.onclick = () => { roomFilter = b.dataset.f; render(); });
  $('recapBtn').onclick = () => { recapOpen = !recapOpen; $('recapBtn').classList.toggle('danger', false); render(); };

  if (ADMIN) wireDrop($('glist'), (gid) => unplace(gid), false);

  // ---------- chambre : ajout / modification ----------
  function simpleRoomDialog(r) {
    const isNew = !r;
    const o = document.createElement('div'); o.className = 'ovl';
    o.innerHTML = '<form class="dlg"><strong>' + (isNew ? 'Nouvelle chambre' : 'Modifier la chambre') + '</strong>' +
      '<label>Nom<input type="text" id="fn" maxlength="60" required></label>' +
      '<label>Nombre de places<input type="number" id="fc" min="1" max="30" required></label>' +
      '<div class="act"><button type="button" class="btn ghost" id="fx">Annuler</button><button class="btn">Enregistrer</button></div></form>';
    document.body.append(o);
    const $$ = (id) => o.querySelector('#' + id);
    $$('fn').value = r ? r.name : 'Chambre ' + (data.rooms.length + 1); $$('fc').value = r ? capOf(r) : 2;
    $$('fx').onclick = () => o.remove();
    o.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      const cap = Math.max(1, Math.min(30, parseInt($$('fc').value, 10) || 1)), name = $$('fn').value.trim() || 'Chambre';
      if (r && occ(r.id).length > cap) { toast('Il y a déjà ' + occ(r.id).length + ' invités dans cette chambre : retirez-en d\'abord.'); return; }
      if (isNew) data.rooms.push({ id: uid(), name, cap }); else { r.name = name; r.cap = cap; }
      o.remove(); save(); render();
    };
    $$('fn').focus(); $$('fn').select();
  }
  function roomDialog(r) {
    if (SIMPLE()) return simpleRoomDialog(r);
    const isNew = !r;
    const cur = {}; TYPE_ORDER.forEach(t => cur[t] = r ? r.beds.filter(b => b.type === t).length : (t === 'double' ? 1 : 0));
    const o = document.createElement('div'); o.className = 'ovl';
    o.innerHTML = '<form class="dlg"><strong>' + (isNew ? 'Nouvelle chambre' : 'Modifier la chambre') + '</strong>' +
      '<label>Nom<input type="text" id="fn" maxlength="60" required></label>' +
      TYPE_ORDER.map(t => '<div class="bt"><div>' + TYPES[t].label + '<br><small>' + TYPES[t].hint + '</small></div><div class="step"><button type="button" data-m="' + t + '">−</button><b id="c_' + t + '">0</b><button type="button" data-p="' + t + '">+</button></div></div>').join('') +
      '<div id="ft" style="font-weight:700"></div>' +
      '<div class="act"><button type="button" class="btn ghost" id="fx">Annuler</button><button class="btn">Enregistrer</button></div></form>';
    document.body.append(o);
    const $$ = (id) => o.querySelector('#' + id);
    const paint = () => { let p = 0; TYPE_ORDER.forEach(t => { $$('c_' + t).textContent = cur[t]; p += cur[t] * TYPES[t].places; }); $$('ft').textContent = '= ' + p + ' place' + (p > 1 ? 's' : ''); return p; };
    o.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { cur[b.dataset.m] = Math.max(0, cur[b.dataset.m] - 1); paint(); });
    o.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { cur[b.dataset.p] = Math.min(10, cur[b.dataset.p] + 1); paint(); });
    $$('fn').value = r ? r.name : 'Chambre ' + (data.rooms.length + 1); paint();
    $$('fx').onclick = () => o.remove();
    o.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      if (paint() < 1) { toast('Ajoutez au moins un couchage.'); return; }
      const beds = r ? r.beds.slice() : [];
      for (const t of TYPE_ORDER) {
        const mine = beds.filter(b => b.type === t);
        for (let i = mine.length; i < cur[t]; i++) beds.push({ id: uid(), type: t });
        if (mine.length > cur[t]) {          // on retire d'abord des lits vides, jamais un lit occupé
          const empties = mine.filter(b => Array.from({ length: TYPES[t].places }, (_, i) => whoAt(b.id + ':' + i)).every(x => !x)).reverse();
          const need = mine.length - cur[t];
          if (empties.length < need) { toast('Des invités dorment dans ces lits : retirez-les d\'abord.'); return; }
          empties.slice(0, need).forEach(b => beds.splice(beds.indexOf(b), 1));
        }
      }
      const name = $$('fn').value.trim() || 'Chambre';
      if (isNew) data.rooms.push({ id: uid(), name, beds }); else { r.name = name; r.beds = beds; }
      o.remove(); save(); render();
    };
    $$('fn').focus(); $$('fn').select();
  }
  $('addRoom').onclick = () => roomDialog(null);

  $('q').addEventListener('input', render); $('filter').addEventListener('change', render);

  render();
  await loadGuests();
  if (!ADMIN) hub.poll((d) => { load(d); render(); });
  else hub.poll((d) => { const a = document.activeElement; if (a && /^(INPUT|SELECT)$/.test(a.tagName)) return false; load(d); render(); });
  setInterval(() => { if (!document.hidden) loadGuests(); }, 30000);
})();
</script>
</body>
</html>
