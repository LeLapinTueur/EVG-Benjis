<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chambres</title>
<style>
  :root { --ink:#1f2a3c; --mut:#6b7587; --acc:#3d6fb6; --acc2:#2c5391; --bg:#f3f5f9; --card:#fff; --line:#dde3ee; --ok:#2e7d32; --bad:#b3261e; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  body.booting main { visibility:hidden; }
  main { max-width:1280px; margin:0 auto; padding:14px; }
  .head { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .head h1 { font-size:22px; margin:0; flex:1; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; color:var(--mut); }
  .stat b { color:var(--ink); font-size:16px; }
  .layout { display:grid; grid-template-columns:300px 1fr; gap:14px; align-items:start; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .side { position:sticky; top:56px; max-height:calc(100vh - 70px); display:flex; flex-direction:column; }
  @media (max-width:820px) { .side { position:static; max-height:none; } }
  .side h2, .panel h2 { font-size:15px; margin:0 0 8px; }
  input[type=text], input[type=number], input[type=search], select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; width:100%; }
  .btn { background:var(--acc); color:#fff; border:0; border-radius:9px; padding:8px 14px; font:600 14px inherit; font-family:inherit; cursor:pointer; }
  .btn:hover { background:var(--acc2); } .btn.ghost { background:#fff; color:var(--acc2); border:1px solid var(--line); } .btn.danger { background:#fff; color:var(--bad); border:1px solid #efc4c0; }
  .btn.sm { padding:4px 9px; font-size:13px; }
  .tools { display:grid; gap:6px; margin-bottom:8px; }
  .addrow { display:flex; gap:6px; }
  .glist { overflow:auto; flex:1; min-height:80px; display:grid; gap:5px; align-content:start; padding:2px; border-radius:10px; }
  .glist.over { outline:2px dashed var(--acc); background:#eef3fb; }
  .g { display:flex; align-items:center; gap:6px; background:#f7f9fd; border:1px solid var(--line); border-radius:8px; padding:5px 8px; cursor:grab; user-select:none; }
  .g .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g.dragging { opacity:.4; } .g.ro { cursor:default; }
  .g select { width:auto; max-width:110px; padding:3px 4px; font-size:12px; }
  .empty { color:var(--mut); text-align:center; padding:14px 6px; font-size:14px; }
  .rooms { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .room { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; min-height:150px; }
  .room.over { border-color:var(--acc); background:#eef3fb; } .room.full { border-color:#b9d8bb; } .room.bad { border-color:#e8b4b0; }
  .rh { display:flex; align-items:flex-start; gap:6px; } .rh .t { flex:1; font-weight:700; font-size:16px; overflow-wrap:anywhere; }
  .meta { font-size:13px; color:var(--mut); display:flex; gap:10px; flex-wrap:wrap; }
  .cap { font-weight:700; } .cap.full { color:var(--ok); } .cap.bad { color:var(--bad); }
  .bar { height:6px; background:#e8edf5; border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--acc); }
  .occ { display:grid; gap:5px; align-content:start; flex:1; }
  .hint { color:var(--mut); font-size:13px; text-align:center; border:1px dashed var(--line); border-radius:8px; padding:10px; }
  .warn { color:var(--bad); font-size:12px; }
  .ovl { position:fixed; inset:0; background:rgba(20,30,50,.5); display:grid; place-items:center; padding:16px; z-index:120; }
  .dlg { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:380px; display:grid; gap:10px; }
  .dlg label { display:grid; gap:3px; font-size:13px; color:var(--mut); } .dlg .r3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .dlg .act { display:flex; gap:8px; justify-content:flex-end; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#1f2a3c; color:#fff; padding:10px 16px; border-radius:10px; z-index:150; display:none; max-width:90vw; }
  body.ro .adm { display:none !important; }
</style>
</head>
<body class="booting">
<main>
  <div class="head">
    <h1>🛏️ Attribution des chambres</h1>
    <div class="stats" id="stats"></div>
    <button class="btn adm" id="addRoom" type="button">＋ Ajouter une chambre</button>
  </div>
  <div class="layout">
    <aside class="panel side">
      <h2>Invités <span id="gcount" style="color:var(--mut);font-weight:400"></span></h2>
      <div class="tools">
        <input type="search" id="q" placeholder="Rechercher un invité…">
        <select id="filter"><option value="free">Sans chambre</option><option value="all">Tous</option><option value="placed">Avec chambre</option></select>
        <div class="note" style="font-size:13px;color:var(--mut)">Les invités se gèrent dans le site <a href="/invites/">Invités</a>.</div>
      </div>
      <div class="glist" id="glist"></div>
    </aside>
    <section>
      <div class="rooms" id="rooms"></div>
      <div class="empty" id="noRooms" hidden>Aucune chambre pour l'instant.<span class="adm"> Cliquez sur « Ajouter une chambre ».</span></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="/shared/config.js"></script>
<script src="/shared/hub.js"></script>
<script>
(async function () {
  const SLUG = 'chambres';
  const hub = await Hub.connect(SLUG);
  hub.mountBar();
  const ADMIN = hub.isAdmin;
  document.body.classList.toggle('ro', !ADMIN);
  document.body.classList.remove('booting');
  const $ = (id) => document.getElementById(id);
  const esc = Hub.esc;
  const ses = Hub.getSession(SLUG), token = ses ? ses.token : null;
  const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); };
  const uid = () => 'r' + Math.random().toString(36).slice(2, 8);

  let data = { rooms: [], assign: {} };
  let guests = [];                // [{id, name}] — vient du plan de table
  function load(d) {
    data = { rooms: Array.isArray(d && d.rooms) ? d.rooms : [], assign: (d && d.assign && typeof d.assign === 'object') ? d.assign : {} };
  }
  load(hub.data);
  const save = () => { if (!ADMIN) return; hub.save(() => { // on ne garde que les attributions valides
    const ids = new Set(data.rooms.map(r => r.id)), out = {};
    Object.keys(data.assign).forEach(g => { if (ids.has(data.assign[g])) out[g] = data.assign[g]; });
    data.assign = out; return data; }); };

  const gById = (id) => guests.find(g => g.id === id);
  const occ = (rid) => guests.filter(g => data.assign[g.id] === rid).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const roomOf = (gid) => data.assign[gid] && data.rooms.find(r => r.id === data.assign[gid]);

  async function loadGuests() {
    try {
      const rows = await Hub.rpc('invites_list', { p_slug: SLUG, p_token: token });
      guests = (rows || []).map(r => ({ id: r.id, name: r.name }));
      render();
    } catch (e) { toast('Liste des invités indisponible : ' + e.message); }
  }

  // ---------- déplacement ----------
  function move(gid, rid) {
    if (!ADMIN) return;
    if (rid) {
      const r = data.rooms.find(x => x.id === rid); if (!r) return;
      if (data.assign[gid] === rid) return;
      if (occ(rid).length >= r.cap) { toast('« ' + r.name + ' » est complète (' + r.cap + ' places).'); return; }
      data.assign[gid] = rid;
    } else delete data.assign[gid];
    save(); render();
  }
  function wireDrag(el, gid) {
    el.draggable = true;
    el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', gid); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  }
  function wireDrop(el, rid) {
    el.addEventListener('dragover', (e) => { if (!ADMIN) return; e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('over'); const gid = e.dataTransfer.getData('text/plain'); if (gid && gById(gid)) move(gid, rid); });
  }

  // ---------- rendu ----------
  function guestRow(g, inRoom) {
    const d = document.createElement('div'); d.className = 'g' + (ADMIN ? '' : ' ro');
    const r = roomOf(g.id);
    d.innerHTML = '<span class="nm" title="' + esc(g.name) + '">' + esc(g.name) + '</span>';
    if (ADMIN) {
      wireDrag(d, g.id);
      const sel = document.createElement('select'); sel.title = 'Choisir une chambre (sans glisser)';
      sel.innerHTML = '<option value="">' + (inRoom ? 'Retirer' : 'Chambre…') + '</option>' +
        data.rooms.map(x => '<option value="' + x.id + '"' + (r && r.id === x.id ? ' selected' : '') + '>' + esc(x.name) + (occ(x.id).length >= x.cap && !(r && r.id === x.id) ? ' (pleine)' : '') + '</option>').join('');
      if (inRoom) sel.value = '';
      sel.onchange = () => move(g.id, sel.value || null);
      d.append(sel);
    } else if (!inRoom && r) { const s = document.createElement('span'); s.style.cssText = 'color:var(--mut);font-size:12px'; s.textContent = r.name; d.append(s); }
    return d;
  }
  function render() {
    const validIds = new Set(guests.map(g => g.id));
    const placed = guests.filter(g => roomOf(g.id)).length;
    const places = data.rooms.reduce((a, r) => a + (+r.cap || 0), 0);
    const beds = data.rooms.reduce((a, r) => [a[0] + (+r.single || 0), a[1] + (+r.double || 0)], [0, 0]);
    $('stats').innerHTML =
      '<div class="stat"><b>' + placed + '/' + guests.length + '</b> invités placés</div>' +
      '<div class="stat"><b>' + data.rooms.length + '</b> chambres · <b>' + places + '</b> places</div>' +
      '<div class="stat"><b>' + beds[0] + '</b> lits simples · <b>' + beds[1] + '</b> doubles</div>';
    // liste de gauche
    const q = $('q').value.trim().toLowerCase(), f = $('filter').value;
    const list = guests.filter(g => g.name.toLowerCase().includes(q) && (f === 'all' || (f === 'free') === !roomOf(g.id)))
                       .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    $('gcount').textContent = '(' + (guests.length - placed) + ' sans chambre)';
    const gl = $('glist'); gl.replaceChildren(...list.map(g => guestRow(g, false)));
    if (!list.length) gl.innerHTML = '<div class="empty">' + (!guests.length ? 'Aucun invité : ajoutez-en dans le site Invités.' : f === 'free' && !q ? 'Tout le monde a une chambre 🎉' : 'Aucun résultat.') + '</div>';
    // chambres
    const box = $('rooms'); box.replaceChildren();
    $('noRooms').hidden = data.rooms.length > 0;
    data.rooms.forEach(r => {
      const list = occ(r.id), n = list.length, cap = +r.cap || 0, full = n >= cap && cap > 0;
      const el = document.createElement('div'); el.className = 'room' + (full ? ' full' : '');
      const bedCap = (+r.single || 0) + 2 * (+r.double || 0);
      el.innerHTML =
        '<div class="rh"><span class="t">' + esc(r.name) + '</span>' +
        (ADMIN ? '<button class="btn ghost sm" data-e title="Modifier">✏️</button><button class="btn danger sm" data-d title="Supprimer">🗑️</button>' : '') + '</div>' +
        '<div class="meta"><span class="cap ' + (full ? 'full' : '') + '">' + n + '/' + cap + ' places</span><span>🛏️ ' + (+r.single || 0) + ' simple' + ((+r.single || 0) > 1 ? 's' : '') + '</span><span>🛌 ' + (+r.double || 0) + ' double' + ((+r.double || 0) > 1 ? 's' : '') + '</span></div>' +
        '<div class="bar"><i style="width:' + (cap ? Math.min(100, n / cap * 100) : 0) + '%"></i></div>' +
        (cap > bedCap ? '<div class="warn">⚠️ ' + cap + ' places pour ' + bedCap + ' couchages (simple = 1, double = 2).</div>' : '');
      const oc = document.createElement('div'); oc.className = 'occ';
      list.forEach(g => oc.append(guestRow(g, true)));
      if (!list.length) oc.innerHTML = '<div class="hint">' + (ADMIN ? 'Glissez un invité ici' : 'Vide') + '</div>';
      el.append(oc);
      if (ADMIN) {
        wireDrop(el, r.id);
        el.querySelector('[data-e]').onclick = () => roomDialog(r);
        el.querySelector('[data-d]').onclick = () => {
          if (confirm('Supprimer « ' + r.name + ' » ?' + (n ? '\n' + n + ' invité(s) redeviendront « sans chambre ».' : ''))) {
            data.rooms = data.rooms.filter(x => x.id !== r.id); save(); render();
          }
        };
      }
      box.append(el);
    });
  }
  if (ADMIN) wireDrop($('glist'), null);

  // ---------- chambre : ajout / modification ----------
  function roomDialog(r) {
    const isNew = !r; r = r || { id: uid(), name: 'Chambre ' + (data.rooms.length + 1), cap: 2, single: 0, double: 1 };
    const o = document.createElement('div'); o.className = 'ovl';
    o.innerHTML = '<form class="dlg"><strong>' + (isNew ? 'Nouvelle chambre' : 'Modifier la chambre') + '</strong>' +
      '<label>Nom<input type="text" id="fn" maxlength="60" required></label>' +
      '<div class="r3"><label>Places<input type="number" id="fc" min="1" max="30" required></label>' +
      '<label>Lits simples<input type="number" id="fs" min="0" max="30"></label><label>Lits doubles<input type="number" id="fd" min="0" max="30"></label></div>' +
      '<div class="warn" id="fw" hidden></div><div class="act"><button type="button" class="btn ghost" id="fx">Annuler</button><button class="btn">Enregistrer</button></div></form>';
    document.body.append(o);
    const $$ = (id) => o.querySelector('#' + id);
    $$('fn').value = r.name; $$('fc').value = r.cap; $$('fs').value = r.single || 0; $$('fd').value = r.double || 0;
    const check = () => { const c = +$$('fc').value || 0, b = (+$$('fs').value || 0) + 2 * (+$$('fd').value || 0); $$('fw').hidden = c <= b; $$('fw').textContent = '⚠️ ' + c + ' places pour ' + b + ' couchages.'; };
    ['fc', 'fs', 'fd'].forEach(i => $$(i).addEventListener('input', check)); check();
    $$('fx').onclick = () => o.remove();
    o.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      const nr = { id: r.id, name: $$('fn').value.trim() || r.name, cap: Math.max(1, Math.min(30, parseInt($$('fc').value, 10) || 1)),
                   single: Math.max(0, parseInt($$('fs').value, 10) || 0), double: Math.max(0, parseInt($$('fd').value, 10) || 0) };
      if (!isNew && occ(r.id).length > nr.cap) { toast('Il y a déjà ' + occ(r.id).length + ' invités dans cette chambre : retirez-en d\'abord.'); return; }
      if (isNew) data.rooms.push(nr); else data.rooms[data.rooms.findIndex(x => x.id === r.id)] = nr;
      o.remove(); save(); render();
    };
    $$('fn').focus(); $$('fn').select();
  }
  $('addRoom').onclick = () => roomDialog(null);

  $('q').addEventListener('input', render); $('filter').addEventListener('change', render);

  render();
  await loadGuests();
  if (!ADMIN) hub.poll((d) => { load(d); render(); });
  else hub.poll((d) => { const a = document.activeElement; if (a && /^(INPUT|SELECT)$/.test(a.tagName)) return false; load(d); render(); });
  setInterval(() => { if (!document.hidden) loadGuests(); }, 30000);
})();
</script>
</body>
</html>
